# yaml-language-server: $schema=./schema/run_manifest.schema.json
run_id: l3-student-homework-smoke
evaluation_level: 3
system_under_test:
- model_id: gemini/gemini-3.5-flash-lite
  temperature: 0.7
test_case_records_path: test_case_records/l3_student_homework_smoke.jsonl
run_dir: results/l3-student-homework-smoke
simulation:
    batch_size: 1
    max_turns: 6
    person_response_model:
        model_id: local/llama3.2
        temperature: 0.9
    elicitation_fidelity:
        enabled: true
        model:
            model_id: gemini/gemini-3.5-flash-lite
            temperature: 0.0
        prompt_version: elicitation-fidelity-v3
judges:
- judge_type: kl_two_stage
  model:
      model_id: gemini/gemini-3.5-flash-lite
      temperature: 0.0
  options:
      group_size: 8
      max_concurrency: 1
      prompt_version: verdict_anchor
